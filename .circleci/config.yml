# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

parameters:
  os:
    type: string
    default: "ubuntu-22.04"
  mode:
    type: string
    default: "newlib"
  compiler:
    type: string
    default: "gcc"

jobs:
  build-ubuntu-22_04:
    machine:
      image: ubuntu-2204:current
      resource_class: large
    steps:
      - checkout
      - run:
          name: Setup swap space
          command: |
            sudo fallocate -l 80G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
      - run:
          name: install dependencies
          command: sudo -E .github/setup-apt.sh
      - run:
          name: build toolchain
          command: |
            ./configure --prefix=/mnt/xuantie --enable-multilib --enable-libgomp
            sudo mkdir /mnt/xuantie
            sudo chown $(whoami):$(whoami) /mnt/xuantie
            make -j $(nproc)
      - run:
          name: tarball build
          command: |
            du -s -h /mnt/xuantie
            .github/dedup-dir.sh /mnt/xuantie/
            TOOLCHAIN_NAME="xuantie-elf-ubuntu-22.04-gcc"
            XZ_OPT="-e -T0" tar cJvf ${TOOLCHAIN_NAME}.tar.xz -C /mnt/ xuantie/
      - store_artifacts:
          path: xuantie-elf-ubuntu-22.04-gcc.tar.xz
          destination: toolchain-tarball

  build-ubuntu-24_04:
    machine:
      image: ubuntu-2404:current
      resource_class: large
    steps:
      - checkout
      - run:
          name: Setup swap space
          command: |
            sudo fallocate -l 80G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
      - run:
          name: install dependencies
          command: sudo -E .github/setup-apt.sh
      - run:
          name: build toolchain
          command: |
            ./configure --prefix=/mnt/xuantie --enable-multilib --enable-libgomp
            sudo mkdir /mnt/xuantie
            sudo chown $(whoami):$(whoami) /mnt/xuantie
            make -j $(nproc)
      - run:
          name: tarball build
          command: |
            du -s -h /mnt/xuantie
            .github/dedup-dir.sh /mnt/xuantie/
            TOOLCHAIN_NAME="xuantie-elf-ubuntu-24.04-gcc"
            XZ_OPT="-e -T0" tar cJvf ${TOOLCHAIN_NAME}.tar.xz -C /mnt/ xuantie/
      - store_artifacts:
          path: xuantie-elf-ubuntu-24.04-gcc.tar.xz
          destination: toolchain-tarball
      - run:
          name: make report
          command: |
            make report-newlib -j $(nproc)

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-ubuntu-22_04
      - build-ubuntu-24_04